name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build-only (no push/load): validates the image compiles and warms the
      # GHA layer cache. mode=max caches intermediate stages too, so PRs that
      # only touch src/ reuse the npm-ci layers from main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: swagscout:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
