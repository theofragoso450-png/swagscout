name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatch on a tag ref (e.g. v0.2.0) to build that tag's image and
  # upload it as a downloadable artifact for attaching to the release.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: vitest >=4.1.11 (the GHSA-82fw-gwwq-j7x9 fix) requires it,
          # and it matches the Dockerfile's node:24-slim runtime.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Plain build: at this image size (~20s of real work) the buildx + GHA
      # cache machinery costs ~35s in fixed overhead — measured slower warm
      # (59s) than a no-cache build (26s). The timing below flags the moment
      # the build grows heavy enough that caching would likely pay again.
      - name: Build image (timed)
        run: |
          START=$(date +%s)
          docker build -t swagscout:ci .
          BUILD_SECONDS=$(( $(date +%s) - START ))
          echo "Docker build took ${BUILD_SECONDS}s"
          # ~35s is the buildx+cache machinery tax measured in PR #5; caching
          # only breaks even once the build itself comfortably exceeds it.
          if [ "$BUILD_SECONDS" -ge 90 ]; then
            echo "::warning::Docker build took ${BUILD_SECONDS}s (threshold 90s). Dependency layers are heavy enough that buildx layer caching (mode=max, see PRs #3/#5) is worth re-measuring before assuming a plain build is fastest."
          fi

      # Export + upload only on manual dispatch (PRs don't need image artifacts).
      - name: Export image
        if: github.event_name == 'workflow_dispatch'
        run: docker save swagscout:ci | gzip > "swagscout-image-${{ github.ref_name }}.tar.gz"

      - name: Upload image artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: swagscout-image-${{ github.ref_name }}
          path: swagscout-image-*.tar.gz
          retention-days: 7
