name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain build: at this image size (~20s of real work) the buildx + GHA
      # cache machinery costs ~35s in fixed overhead — measured slower warm
      # (59s) than a no-cache build (26s). Revisit only if the dependency
      # tree grows heavy enough for cached layers to beat the tax.
      - run: docker build -t swagscout:ci .
